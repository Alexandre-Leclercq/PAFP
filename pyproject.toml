[project]
name = "PAFP"
version = "0.1.0"
description = "PAFP: Personalized Aligner Federated Pretrained - Federated Transfer Learning for Medical Image Classification under Mixed Skew"
authors = [{ name = "Alexandre LECLERCQ", email = "alexandre.leclercq@unicaen.fr" }]
requires-python = ">=3.10,<4"
readme = "README.MD"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyterlab>=4.4.0,<5",
    "notebook>=7.3.3,<8",
    "nibabel>=5.2.1,<6",
    "einops>=0.8.0,<0.9",
    "matplotlib>=3.9.0,<4",
    "omegaconf>=2.3.0,<3",
    "lpips>=0.1.4,<0.2",
    "torchinfo>=1.8.0,<2",
    "hydra-core>=1.3.2,<2",
    "lightning>=2.5.1.post0,<3",
    "pytest>=8.4.1,<9",
    "pandas>=2.3.2,<3",
    "torch==2.7",
    "torchvision==0.22",
    "tensorboard>=2.20.0,<3",
    "scikit-learn>=1.7.2,<2",
    "timm>=1.0.24,<2",
    "umap-learn>=0.5.11,<0.6",
    "pyarrow>=23.0.0,<24",
    "datasets>=4.5.0,<5",
    "albumentations>=2.0.8,<3",
    "h5py>=3.16.0,<4",
    "seaborn>=0.13.2,<0.14",
    "torch-fidelity>=0.4.0,<0.5",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-gpu" }
torchvision = { index = "pytorch-gpu" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
