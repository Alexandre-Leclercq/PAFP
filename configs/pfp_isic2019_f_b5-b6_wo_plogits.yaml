defaults:
  - global: local_settings
  - learning: federated
  - override /learning/federated@learning: fedavg

  - override /learning/partitioning: multi_dataset
  - override /learning/partitioning/data@learning.partitioning: fed_isic2019

  - override /model@learning.clients.model: pfp_efficient_net
  - override /trainer@learning.clients.trainer: custom_trainer

  - override /model@learning.server.global_model: pfp_efficient_net
  - override /trainer@learning.server.global_trainer: server_trainer

  - _self_

#code_test: True
learning:
  server:
    robust_validation: False
    n_round: 1500
    global_model:
      in_channels: ${...partitioning.data.1.datamodule.n_channel}
      img_size: ${if_not_null:${oc.select:...partitioning.data.1.datamodule.resize, null}, ${...partitioning.data.1.datamodule.img_size}}
      n_class: ${...partitioning.data.1.datamodule.n_class}
      unfrozen_params:
        - "blocks.5"
        - "blocks.6"
        - "conv_head"
        - "bn2"
      local_params_keys: []
  clients:
    n_client: ${..partitioning.n_datasets}
    model:
      optimizer: torch.optim.SGD
      learning_rate: 1e-2
      gradient_logging: True
      weight_decay: 1e-5
      weighted_loss: True
      personalized_logits: False
      gradient_clip_val: 0.0
      in_channels: ${...partitioning.data.1.datamodule.n_channel}
      img_size: ${if_not_null:${oc.select:...partitioning.data.1.datamodule.resize, null}, ${...partitioning.data.1.datamodule.img_size}}
      n_class: ${...partitioning.data.1.datamodule.n_class}
      unfrozen_params:
        - "blocks.5"
        - "blocks.6"
        - "conv_head"
        - "bn2"
      local_params_keys: []
      loss:
        _target_: lab.utils.loss.FocalLoss
        alpha: null # compute dynamically
        gamma: 2.0
    steps_mode: 'epoch'
    max_steps: 1
    trainer:
      enable_progress_bar: True
  partitioning:
    datamodule_shared_parameters: # define the shared parameters between datamodule of each
      batch_size: 64
